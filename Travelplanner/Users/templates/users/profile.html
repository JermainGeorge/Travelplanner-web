{% extends 'planner/base_auth.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
      <div class="d-flex flex-column align-items-center text-center mb-4">
        <img class="rounded-circle account-img mb-3" src="{{ user.profile.image.url }}" alt="{{ user.username }} profile image">
        <div>
          <h2 class="account-heading h3 mb-1">{{ user.username }}</h2>
          <p class="text-secondary mb-0">{{ user.email }}</p>
        </div>
      </div>
      <!-- FORM HERE -->
       <!--Add an encoding in order to upload our img files -->
       <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Profile info</legend>
                {{ u_form|crispy }}
                {{ p_form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn wonder-btn w-100" type="submit">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
