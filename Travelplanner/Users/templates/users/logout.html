{% extends 'planner/base_auth.html' %}
{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-sm">
        <h2 class="mb-3">You have been logged out</h2>
        <p class="mb-4">Thanks for visiting WonderWaves. Your next coastal plan will be ready when you return.</p>

            <small>

                <a class="ms-2 text-decoration-none" href="{% url 'users-login' %}">Log In again</a>

        </div>
    </div>
</div>
{% endblock content %}
