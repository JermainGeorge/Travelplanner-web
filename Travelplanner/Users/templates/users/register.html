{% extends "planner/base_auth.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="auth-page">
    <div class="auth-card">
            <h1 class="h3 mb-2">Welcome to WonderWaves</h1>
            <p class="mb-4">Create your account and start booking beach escapes with ease.</p>
            <form method="POST">
                {% csrf_token %}
                <fieldset class="form-group">
                    <legend class="border-bottom mb-4">Join Today</legend>
                    {{ form|crispy }}
                </fieldset>
                <div class="form-group">
                    <button class="btn wonder-btn w-100" type="submit">Sign Up</button>
                </div>
            </form>
            <div class="border-top pt-3 mt-3">
                <small>
                    Already have an account? <a class="ms-2 text-decoration-none" href="{% url 'users-login'%}">Log In</a>
                </small>
            </div>
    </div>
</div>
{% endblock content %}
