{% extends "planner/base_auth.html" %}
{% load crispy_forms_tags %}
{% block content %}

<div class="auth-page">
    <div class="auth-card">
        <h4 class="mb-2">Welcome Back</h4>
        <p class="mb-4">Log in to continue planning your next WonderWaves trip.</p>
        <form method="POST">
            {% csrf_token %}

            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Log In</legend>

                {{ form|crispy }}
            </fieldset>

            <div class="mt-3">
                <button class="btn wonder-btn w-100" type="submit">
                    Log In
                </button>
            </div>
        </form>

        <div class="border-top pt-3 mt-3">
            <small>
                Need an account?
                <a class="ms-2 text-decoration-none"
                   href="{% url 'users-register' %}">
                    Sign Up Now
                </a>
            </small>
        </div>
    </div>
</div>

{% endblock content %}
